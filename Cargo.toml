[workspace]
resolver = "3"
members = ["crates/devbox-cli", "crates/devbox-core", "crates/devbox-sync", "crates/devbox-context", "tests/rust"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/prabhask5/devbox"

[workspace.dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
devbox-cli = { path = "crates/devbox-cli" }
devbox-context = { path = "crates/devbox-context", version = "0.0.0" }
devbox-core = { path = "crates/devbox-core", version = "0.0.0" }
devbox-sync = { path = "crates/devbox-sync", version = "0.0.0" }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
getrandom = "0.4"
proptest = { version = "1.12", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"
print_stderr = "deny"

# argon2id with production parameters takes seconds per hash when unoptimized.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
