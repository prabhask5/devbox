# Written by `devbox up`: the editor and the agents app, through the devbox gateway.
http:
  routers:
    devbox-code:
      rule: Host(`code.example.com`)
      entryPoints:
        - websecure
      service: devbox-gateway
      tls: {}
    devbox-agents:
      rule: Host(`agents.example.com`)
      entryPoints:
        - websecure
      service: devbox-gateway
      tls: {}
  services:
    devbox-gateway:
      loadBalancer:
        servers:
          - url: http://devbox-gateway:8080
