# Written by `devbox up`: the editor, the agents app and SSH, through the devbox gateway.
http:
  routers:
    devbox-code:
      rule: Host(`code.example.com`)
      entryPoints:
        - websecure
      service: devbox-gateway
      tls: {}
    devbox-agents:
      rule: Host(`agents.example.com`)
      entryPoints:
        - websecure
      service: devbox-gateway
      tls: {}
    devbox-ssh:
      rule: Host(`devbox.example.com`)
      entryPoints:
        - websecure
      service: devbox-gateway
      tls: {}
  services:
    devbox-gateway:
      loadBalancer:
        servers:
          - url: http://devbox-gateway:8080
