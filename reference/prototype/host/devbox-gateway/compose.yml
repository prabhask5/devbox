# Deployed to /opt/services/devbox-gateway on cestmoi.
services:
  devbox-gateway:
    build: .
    image: local/devbox-gateway
    container_name: devbox-gateway
    restart: unless-stopped
    env_file: .env
    volumes:
      # Root-equivalent access to Incus: needed to start/stop the VM.
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
      - ./data:/data
    networks: [dokploy-network, homelab]

networks:
  dokploy-network: { external: true }   # Traefik reaches the gateway here
  homelab: { external: true }           # cloudflared reaches the SSH proxy here
