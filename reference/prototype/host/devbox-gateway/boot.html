<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>devbox</title>
<style>
  :root { --bg:#0b0d10; --card:#13161b; --line:#232830; --text:#e6e8eb; --dim:#8b929c; --faint:#5a616b;
          --accent:#7cc4ff; --ok:#5fd38d; --warn:#f2c14e; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 15px/1.45 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  body { display:flex; align-items:center; justify-content:center; padding: max(24px, env(safe-area-inset-top)) 20px 24px; }
  main { width:100%; max-width:460px; }
  .brand { display:flex; align-items:center; gap:10px; color:var(--dim); font-size:13px; margin-bottom:22px; letter-spacing:.02em; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--faint); box-shadow:0 0 0 4px #ffffff08; }
  .dot.live { background:var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  @keyframes pulse { 50% { box-shadow:0 0 0 7px #7cc4ff22; } }
  h1 { font-size:26px; line-height:1.2; margin:0 0 6px; font-weight:650; letter-spacing:-.01em; }
  .sub { color:var(--dim); margin:0 0 22px; min-height:1.45em; }
  .bar { height:6px; background:var(--line); border-radius:99px; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:linear-gradient(90deg,#4aa3ff,var(--accent)); border-radius:99px; transition:width .5s ease; }
  .meta { display:flex; justify-content:space-between; color:var(--dim); font-size:13px; margin:8px 0 20px; font-variant-numeric: tabular-nums; }
  ol { list-style:none; margin:0; padding:0; border:1px solid var(--line); border-radius:14px; background:var(--card); }
  li { display:flex; align-items:center; gap:12px; padding:12px 14px; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .ic { width:18px; height:18px; flex:none; display:grid; place-items:center; }
  .ic .ring { width:14px; height:14px; border-radius:50%; border:2px solid var(--faint); }
  .ic .spin { width:14px; height:14px; border-radius:50%; border:2px solid #7cc4ff33; border-top-color:var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lbl { flex:1; } .lbl small { display:block; color:var(--dim); font-size:12.5px; margin-top:1px; }
  .t { color:var(--dim); font-size:13px; font-variant-numeric: tabular-nums; }
  li.pending .lbl { color:var(--dim); } li.skipped .lbl { color:var(--faint); text-decoration: line-through; }
  .repos { margin:10px 0 0; display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:3px 8px; border-radius:99px; background:#ffffff0a; color:var(--dim); border:1px solid var(--line); }
  .chip.updated { color:var(--ok); border-color:#5fd38d44; } .chip.conflict, .chip.error { color:var(--bad); border-color:#ff6b6b55; }
  .chip.current { color:var(--accent); border-color:#7cc4ff55; }
  form.auth { display:flex; gap:8px; margin-top:4px; }
  input[type=password] { flex:1; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:16px; outline:none; }
  input[type=password]:focus { border-color:var(--accent); }
  button { padding:12px 16px; border-radius:12px; border:0; background:var(--accent); color:#06111c; font-weight:650; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid #7cc4ff44; }
  .row { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .err { color:var(--bad); margin:10px 0 0; }
  details { margin-top:18px; color:var(--dim); font-size:12.5px; }
  summary { cursor:pointer; color:var(--faint); }
  pre { white-space:pre-wrap; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--dim); margin:8px 0 0; max-height:180px; overflow:auto; }
  .hidden { display:none !important; }
  footer { margin-top:26px; color:var(--faint); font-size:12px; text-align:center; }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="dot" id="dot"></span><span id="host">devbox</span></div>
  <h1 id="title">Connecting…</h1>
  <p class="sub" id="sub"></p>

  <section id="authBox" class="hidden">
    <form class="auth" method="post" action="/__devbox/login">
      <input type="password" name="password" placeholder="Wake password" autocomplete="current-password" autofocus required>
      <input type="hidden" name="next" id="next">
      <button>Wake</button>
    </form>
    <p class="err" id="authErr"></p>
  </section>

  <section id="progress" class="hidden">
    <div class="bar"><i id="fill"></i></div>
    <div class="meta"><span id="elapsed">0.0s</span><span id="eta"></span></div>
    <ol id="phases"></ol>
    <div class="repos" id="repos"></div>
    <div class="row">
      <form method="post" action="/__devbox/skip" id="skipForm" class="hidden"><input type="hidden" name="next" id="next2"><button class="ghost">Open now</button></form>
      <button id="retry" class="hidden" onclick="location.reload()">Try again</button>
    </div>
    <details><summary>Details</summary><pre id="log"></pre></details>
  </section>
  <footer id="foot"></footer>
</main>
<script>
const BOOT = /*__BOOT__*/null || {};
const $ = (id) => document.getElementById(id);
const fmt = (ms) => ms < 10000 ? (ms / 1000).toFixed(1) + 's' : Math.round(ms / 1000) + 's';
const appName = BOOT.app === 'agents' ? 'Agents' : 'Code';
$('host').textContent = BOOT.host || 'devbox';
$('next').value = $('next2').value = location.pathname + location.search + location.hash;
document.title = appName + ' · devbox';

let st = null, offset = 0, reloading = false;

if (BOOT.needsAuth) {
  $('authBox').classList.remove('hidden');
  $('title').textContent = 'Devbox is asleep';
  $('sub').textContent = 'Enter your wake password to start it. This device will be remembered.';
  if (BOOT.error) $('authErr').textContent = BOOT.error;
}

function phaseRow(def, w, t) {
  const p = (w.phases || {})[def.id];
  const eta = (w.eta && w.eta.phases[def.id]) || 0;
  let cls = 'pending', icon = '<span class="ring"></span>', time = eta ? '~' + fmt(eta) : '';
  if (p && p.skipped) { cls = 'skipped'; icon = '<span style="color:var(--faint)">–</span>'; time = 'skipped'; }
  else if (p && p.end) { cls = 'done'; icon = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#5fd38d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; time = fmt(p.end - p.start); }
  else if (p && w.current === def.id) { cls = 'active'; icon = '<span class="spin"></span>'; time = fmt(t - p.start) + (eta ? ' / ~' + fmt(eta) : ''); }
  let small = '';
  if (def.id === 'start' && w.kind === 'restore') small = 'Restoring saved memory — your sessions pick up where they left off';
  if (def.id === 'start' && w.kind === 'cold') small = 'Fresh boot';
  if (def.id === 'sync' && w.sync && w.sync.total) small = (w.sync.done || 0) + ' of ' + w.sync.total + ' repos' + (w.sync.current ? ' · ' + w.sync.current : '');
  return '<li class="' + cls + '"><span class="ic">' + icon + '</span><span class="lbl">' + def.label + (small ? '<small>' + small + '</small>' : '') + '</span><span class="t">' + time + '</span></li>';
}

function render() {
  if (!st || BOOT.needsAuth) return;
  const t = Date.now() + offset;
  const w = st.wake;
  const dot = $('dot');
  $('progress').classList.toggle('hidden', !w);
  $('retry').classList.add('hidden');
  $('skipForm').classList.add('hidden');
  if (BOOT.upstreamDown && (!w || w.done)) {
    dot.className = 'dot live';
    $('title').textContent = 'Reconnecting…';
    $('sub').textContent = 'The devbox is up but ' + (BOOT.app === 'agents' ? 'the agents hub' : 'code-server') + " isn't answering yet.";
    if (!reloading) { reloading = true; setTimeout(() => location.reload(), 3000); }
    return;
  }
  if (st.phase === 'stopping') { dot.className = 'dot live'; $('title').textContent = 'Going to sleep…'; $('sub').textContent = 'Saving memory to disk. It will wake right back up after.'; return; }
  if (!w) {
    dot.className = 'dot'; $('title').textContent = st.vm === 'running' ? 'Almost there…' : 'Waking your devbox';
    $('sub').textContent = ''; return;
  }
  if (w.error) {
    dot.className = 'dot bad'; $('title').textContent = "Couldn't wake the devbox";
    $('sub').textContent = w.error; $('retry').classList.remove('hidden');
  } else if (w.done) {
    dot.className = 'dot ok'; $('title').textContent = 'Ready';
    $('sub').textContent = 'Opening ' + (BOOT.app === 'agents' ? 'Agents' : 'VS Code') + '…';
    if (!reloading) { reloading = true; setTimeout(() => location.reload(), 350); }
  } else {
    dot.className = 'dot live';
    $('title').textContent = w.kind === 'restore' ? 'Waking your devbox' : w.kind === 'cold' ? 'Booting your devbox' : 'Getting things ready';
    const typ = st.typical && st.typical[w.kind];
    const total = w.eta ? Object.values(w.eta.phases).reduce((a, b) => a + b, 0) : 0;
    $('sub').textContent = typ && typ.samples ? 'Usually takes about ' + fmt(total) + ' (median of last ' + typ.samples + ')' : 'First wake — learning how long this takes';
  }
  // progress
  const defs = st.phaseDefs || [];
  let doneMs = 0, remaining = 0, curEl = 0;
  for (const d of defs) {
    const p = (w.phases || {})[d.id]; const eta = (w.eta && w.eta.phases[d.id]) || 0;
    if (p && (p.end || p.skipped)) doneMs += p.end ? p.end - p.start : 0;
    else if (p && w.current === d.id) { curEl = t - p.start; remaining += Math.max(0, eta - curEl); }
    else remaining += eta;
  }
  const elapsed = (w.done || w.error) ? (Math.max(...Object.values(w.phases || {}).map((p) => p.end || 0), w.requestedAt) - w.requestedAt) : t - w.requestedAt;
  const pct = w.done ? 100 : Math.min(97, 100 * elapsed / Math.max(1, elapsed + remaining));
  $('fill').style.width = pct + '%';
  $('elapsed').textContent = fmt(Math.max(0, elapsed));
  $('eta').textContent = w.done ? 'done' : w.error ? '' : remaining > 500 ? 'about ' + fmt(remaining) + ' left' : (curEl > 0 ? 'taking a bit longer…' : '');
  $('phases').innerHTML = defs.map((d) => phaseRow(d, w, t)).join('');
  // repos
  const sync = w.sync;
  $('repos').innerHTML = sync && sync.results ? sync.results.map((r) => '<span class="chip ' + r.status + '" title="' + (r.detail || '').replace(/"/g, '&quot;') + '">' + r.name + (r.status === 'updated' ? ' ↓' : r.status === 'conflict' ? ' ⚠' : r.status === 'error' ? ' ✕' : '') + '</span>').join('') + (sync.current ? '<span class="chip current">' + sync.current + '…</span>' : '') : '';
  if (w.current === 'sync' && !w.done) $('skipForm').classList.remove('hidden');
  $('log').textContent = (w.log || []).map((l) => new Date(l.at).toLocaleTimeString() + '  ' + l.m).join('\n');
  const last = st.lastStop;
  $('foot').textContent = last ? 'Went to sleep ' + new Date(last.at).toLocaleString() + ' (' + last.reason + ')' : '';
}

function connect() {
  const es = new EventSource('/__devbox/events');
  es.onmessage = (e) => { st = JSON.parse(e.data); offset = st.serverNow - Date.now(); render(); };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
if (!BOOT.needsAuth) connect();
setInterval(render, 250);
</script>
</body>
</html>
