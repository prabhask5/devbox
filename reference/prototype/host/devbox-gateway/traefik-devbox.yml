# Replaces /etc/dokploy/traefik/dynamic/devbox.yml on cestmoi.
# Both hosts go to the gateway; it proxies to the VM when awake and shows the boot screen when not.
http:
  routers:
    code:
      rule: Host(`code.prabhas.io`)
      entryPoints: [websecure]
      service: devbox-gateway
      tls: {}
    agents:
      rule: Host(`agents.prabhas.io`)
      entryPoints: [websecure]
      service: devbox-gateway
      tls: {}
  services:
    devbox-gateway:
      loadBalancer:
        servers:
          - url: http://devbox-gateway:8080
