name: Release

# Tags v* publish a release: static binaries for amd64 and arm64 with checksums and build provenance
# attestations, install.sh, and the gateway image on GHCR. The tag must pass release-mode hygiene and a full-history secret scan.
# The library crates have their own tags and workflow (publish-crates.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with: { go: true }
      - name: Release hygiene
        run: scripts/check-hygiene.sh --release
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
      - name: Full-history secret scan
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose .

  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: true, rust: true }
      - run: scripts/ci.sh build
        env:
          DEVBOX_RUST_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: bin/
          if-no-files-found: error
          retention-days: 1

  release:
    name: release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cp install.sh dist/
          cd dist && sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    name: image
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, check and push the gateway image
        run: |
          scripts/check-image.sh
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devbox-gateway"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build -f deploy/gateway/Dockerfile --build-arg "VERSION=${GITHUB_REF_NAME#v}" \
            -t "$image:${GITHUB_REF_NAME#v}" -t "$image:latest" .
          docker push --all-tags "$image"
        env:
          GH_TOKEN: ${{ github.token }}
