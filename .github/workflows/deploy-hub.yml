name: Deploy hub

# Every push to main that changes what runs in the VM, once CI has passed for it: build the
# hub and the devbox CLI, keep the build as a workflow artifact with a provenance attestation,
# and create a GitHub Deployment in the `agents-hub` environment. The updater in the VM
# (`devbox-hub update`) installs it and reports how it went (docs/spec/11-deploy.md). Nothing
# here publishes a release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-hub
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  changed:
    name: changed
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.changed.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - name: Did what runs in the VM change since the last deployment?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=agents-hub&per_page=1" --jq '.[0].sha // "none"')
          if scripts/deploy-hub.sh changed "$last" "$SHA"; then echo "deploy=true" >> "$GITHUB_OUTPUT"; fi

  build:
    name: build (${{ matrix.arch }})
    needs: changed
    if: needs.changed.outputs.deploy == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/setup
        with: { go: true, rust: true }
      - run: scripts/ci.sh build
        env:
          DEVBOX_RUST_TARGET: ${{ matrix.target }}
          # The hub answers with this, and the updater checks that it does.
          DEVBOX_VERSION: ${{ env.SHA }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: bin/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bin
          merge-multiple: true
      - run: scripts/deploy-hub.sh package "$SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-${{ env.SHA }}
          path: dist/vm-${{ env.SHA }}/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/vm-${{ env.SHA }}/SHA256SUMS
      - name: Create the deployment
        run: scripts/deploy-hub.sh deployment "$SHA" "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
