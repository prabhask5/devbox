name: CI

# Every job here must pass before a pull request can merge. Branch protection requires only the
# `required` job at the bottom, which fails unless all the others succeeded, so jobs can be added
# or removed without changing repository settings.
#
# Each job runs one stage of scripts/ci.sh, so `scripts/ci.sh` locally is the same as CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Rewrite the visual baselines (tests/e2e/visual) and upload them instead of comparing
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: true, rust: true, web: true }
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.1,cargo-machete@0.10.1
      - run: scripts/ci.sh static
        env:
          CARGO_TOOLS_ROOT: /home/runner/.cargo # cached by the setup action, so cargo-typify is built once
          # Personal identifiers that must not be in the repository (spec 17). A run without the
          # secret (a pull request from a fork) is checked for everything else; a release needs it.
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}

  go:
    name: go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: true, rust: false, web: false }
      - run: scripts/ci.sh go

  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: false, rust: true, web: false }
      - run: scripts/ci.sh rust

  compat:
    name: compat
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: false, rust: true, web: false }
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.1
      - run: scripts/ci.sh compat

  ssh-client:
    name: ssh-client
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: scripts/ci.sh ssh-client

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: false, rust: false, web: true }
      - run: scripts/ci.sh web

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: true, rust: true, web: true }
      - name: Browsers
        run: pnpm -C web install --frozen-lockfile && pnpm -C web --filter devbox-e2e exec playwright install --with-deps chromium webkit
      - name: Update the visual baselines
        if: inputs.update_baselines
        run: scripts/e2e.sh --update-baselines
      - if: inputs.update_baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/e2e/visual/*-linux.png
          if-no-files-found: error
      - run: scripts/ci.sh e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7

  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: true, rust: true }
      - run: scripts/ci.sh build
        env:
          DEVBOX_RUST_TARGET: ${{ matrix.target }}
          DEVBOX_DOCKER: 1
      - name: Binaries are static
        run: |
          for f in bin/*; do file "$f"; file "$f" | grep -qE 'statically linked|static-pie linked'; done

  budgets:
    name: budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with: { go: true, rust: true, web: true }
      - name: Browser
        run: pnpm -C web install --frozen-lockfile && pnpm -C web --filter devbox-e2e exec playwright install --with-deps chromium
      - run: scripts/ci.sh budgets
        env:
          DEVBOX_DOCKER: 1

  required:
    name: required
    if: always()
    needs: [static, go, rust, compat, ssh-client, web, e2e, build, budgets]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
