name: Set up toolchains
description: Installs the pinned Go, Rust and Node/pnpm toolchains a job asks for, with caches.
inputs:
  go:
    description: Set up Go (version from go.mod)
    default: "false"
  rust:
    description: Set up Rust (version from rust-toolchain.toml)
    default: "false"
  web:
    description: Set up Node and pnpm (versions from .node-version and web/package.json)
    default: "false"
runs:
  using: composite
  steps:
    - if: inputs.go == 'true'
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: go.mod
    - if: inputs.rust == 'true'
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install
    - if: inputs.rust == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
    - if: inputs.web == 'true'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: web/package.json
    - if: inputs.web == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
