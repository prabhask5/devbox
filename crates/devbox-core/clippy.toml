# The library crates reach the machine only through `system::System` (docs/spec/12-moi.md):
# moi embeds them and gives them its own host. `system::Host`, the real machine, is the one
# place that is allowed to.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
disallowed-methods = [
    { path = "std::fs::read", reason = "use System::read" },
    { path = "std::fs::read_to_string", reason = "use System::read" },
    { path = "std::fs::read_dir", reason = "use System::read_dir" },
    { path = "std::fs::read_link", reason = "use System::read_link" },
    { path = "std::fs::metadata", reason = "use System::metadata" },
    { path = "std::fs::symlink_metadata", reason = "use System::metadata" },
    { path = "std::fs::write", reason = "use System::write" },
    { path = "std::fs::create_dir", reason = "use System::create_dir_all" },
    { path = "std::fs::create_dir_all", reason = "use System::create_dir_all" },
    { path = "std::fs::remove_file", reason = "use System::remove_file" },
    { path = "std::fs::remove_dir", reason = "the library crates remove no directories" },
    { path = "std::fs::remove_dir_all", reason = "the library crates remove no directories" },
    { path = "std::fs::rename", reason = "use System::write" },
    { path = "std::fs::copy", reason = "use System::read and System::write" },
    { path = "std::fs::set_permissions", reason = "use System::set_mode" },
    { path = "std::fs::File::open", reason = "use System::read" },
    { path = "std::fs::File::create", reason = "use System::write" },
    { path = "std::fs::OpenOptions::new", reason = "use System::write or System::append" },
    { path = "std::fs::DirBuilder::new", reason = "use System::create_dir_all" },
    { path = "std::os::unix::fs::symlink", reason = "use System::symlink" },
    { path = "std::os::unix::fs::chown", reason = "use System::set_owner" },
    { path = "std::path::Path::exists", reason = "use System::exists" },
    { path = "std::path::Path::is_file", reason = "use System::metadata" },
    { path = "std::path::Path::is_dir", reason = "use System::metadata" },
    { path = "std::path::Path::metadata", reason = "use System::metadata" },
    { path = "std::path::Path::read_dir", reason = "use System::read_dir" },
    { path = "std::path::Path::canonicalize", reason = "the library crates resolve no paths" },
    { path = "std::process::Command::new", reason = "use System::run" },
    { path = "std::process::exit", reason = "the caller decides when to exit" },
    { path = "std::net::TcpStream::connect", reason = "the library crates open no network connections" },
    { path = "std::net::TcpListener::bind", reason = "the library crates listen on nothing" },
    { path = "std::net::UdpSocket::bind", reason = "the library crates open no sockets" },
    { path = "std::os::unix::net::UnixStream::connect", reason = "use System::connect_unix" },
    { path = "std::os::unix::net::UnixListener::bind", reason = "the library crates listen on nothing" },
    { path = "std::env::var", reason = "use System::env" },
    { path = "std::env::var_os", reason = "use System::env" },
    { path = "std::env::vars", reason = "use System::env" },
    { path = "std::env::set_var", reason = "the environment is the caller's" },
    { path = "std::env::current_dir", reason = "paths are given, never found" },
    { path = "std::env::temp_dir", reason = "paths are given, never found" },
    { path = "std::env::home_dir", reason = "use System::env" },
    { path = "std::env::args", reason = "the caller parses arguments" },
    { path = "std::time::SystemTime::now", reason = "use System::now" },
    { path = "std::time::Instant::now", reason = "use System::monotonic" },
    { path = "std::thread::sleep", reason = "use System::sleep" },
    { path = "std::io::stdin", reason = "the caller asks" },
    { path = "std::io::stdout", reason = "the caller prints" },
    { path = "std::io::stderr", reason = "the caller prints" },
]
